
<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEBUDCIGAN</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #E8C9B5;
      color: #49372D;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 25px;
      text-align: center;
      background: #F4E4D9;
      box-shadow: 0 3px 15px #00000010;
    }

    header h1 {
      font-size: 30px;
      letter-spacing: 3px;
    }

    main {
      min-height: 75vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .card {
      background: #F7EAE1;
      padding: 55px 35px;
      border-radius: 25px;
      text-align: center;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 35px #75513B20;
    }

    .card h2 {
      font-size: 38px;
      margin-bottom: 20px;
    }

    .card p {
      font-size: 17px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      padding: 14px 30px;
      background: #A77D65;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      transition: 0.3s;
    }

    .button:hover {
      background: #805A46;
      transform: translateY(-3px);
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #765D4F;
    }
  </style>
</head>

<body>

  <header>
    <h1>NEBUDCIGAN</h1>
  </header>

  <main>
    <div class="card">
      <h2>Vítej na mém webu</h2>
      <p>
        Tohle je moje vlastní webová stránka.
        Brzy zde najdeš spoustu zajímavých věcí!
      </p>
      <a href="#" class="button">Zjistit více</a>
    </div>
  </main>

  <footer>
    © 2026 NEBUDCIGAN
  </footer>

</body>
</html>
